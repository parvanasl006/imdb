          # Add, commit, and push
          git add --all
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scaffold initial app structure"
          fi

          # Push branch
          git push --set-upstream origin ${BRANCH}

          # Create a PR using the REST API (if it doesn't already exist)
          REPO_FULL="${REPO}"
          OWNER="$(echo ${REPO_FULL} | cut -d'/' -f1)"
          REPO_NAME="$(echo ${REPO_FULL} | cut -d'/' -f2)"
          PR_EXISTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO_FULL}/pulls?head=${OWNER}:${BRANCH}&state=open" | jq 'length')
          if [ "${PR_EXISTS}" = "0" ]; then
            curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO_FULL}/pulls" -d @- <<'JSON'
{
  "title": "scaffold: initial app structure",
  "head": "'"${BRANCH}"'",
  "base": "main",
  "body": "This PR adds the initial scaffold (created by Actions)."
}
JSON
            echo "Pull request created."
          else
            echo "Pull request already exists."
          fi

      - name: Done
        run: echo "Scaffold job finished."
