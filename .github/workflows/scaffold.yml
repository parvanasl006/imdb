import fetch from 'node-fetch';

class TokenBucket {
  tokens: number;
  capacity: number;
  refillRatePerSec: number;
  lastRefill: number;
  constructor(capacity: number, refillRatePerSec: number) {
    this.capacity = capacity;
    this.tokens = capacity;
    this.refillRatePerSec = refillRatePerSec;
    this.lastRefill = Date.now();
  }
  take(count = 1) {
    const now = Date.now();
    const delta = (now - this.lastRefill) / 1000;
    this.tokens = Math.min(this.capacity, this.tokens + delta * this.refillRatePerSec);
    this.lastRefill = now;
    if (this.tokens >= count) {
      this.tokens -= count;
      return true;
    }
    return false;
  }
}

class CircuitBreaker {
  failureCount = 0;
  successCount = 0;
  state: 'CLOSED' | 'OPEN' | 'HALF' = 'CLOSED';
  openUntil = 0;
  threshold = 5;
  timeoutMs = 30000;
  onSuccess() {
    this.failureCount = 0;
    this.successCount++;
    if (this.state === 'HALF') this.state = 'CLOSED';
  }
  onFailure() {
    this.failureCount++;
    if (this.failureCount >= this.threshold) {
      this.state = 'OPEN';
      this.openUntil = Date.now() + this.timeoutMs;
    }
  }
  allow() {
    if (this.state === 'OPEN') {
      if (Date.now() > this.openUntil) {
        this.state = 'HALF';
        return true;
      }
      return false;
    }
    return true;
  }
}

const bucket = new TokenBucket(40, 40);
const circuit = new CircuitBreaker();

export async function remoteFetch(url: string, opts: any = {}, maxRetries = 4) {
  if (!circuit.allow()) {
    throw new Error('CircuitOpen');
  }

  let attempt = 0;
  while (attempt <= maxRetries) {
    if (!bucket.take()) {
      await new Promise((r) => setTimeout(r, 100 + Math.random() * 200));
      continue;
    }

    try {
      const res = await fetch(url, opts);
      if (res.status >= 500) {
        throw new Error(\`ServerError:\${res.status}\`);
      }
      if (res.status === 429) {
        const retryAfter = res.headers.get('retry-after');
        const waitMs = retryAfter ? parseInt(retryAfter, 10) * 1000 : Math.min(2000 * (attempt + 1), 10000);
        await new Promise((r) => setTimeout(r, waitMs + Math.random() * 300));
        attempt++;
        continue;
      }
      circuit.onSuccess();
      return res;
    } catch (err) {
      attempt++;
      circuit.onFailure();
      if (attempt > maxRetries) throw err;
      const backoff = Math.min(1000 * 2 ** attempt + Math.random() * 200, 10000);
      await new Promise((r) => setTimeout(r, backoff));
      continue;
    }
  }
  throw new Error('Unreachable remoteFetch fallback');
}
EOF

          # providers and helpers
          cat > src/lib/providers/index.ts <<'EOF'
import { remoteFetch } from '@/lib/remoteClient';

export async function fetchMovieFromProvider(provider: string, path: string, params: Record<string, string>) {
  if (provider === 'tmdb') {
    const url = `https://api.themoviedb.org/3/${path}?${new URLSearchParams({ ...params, api_key: process.env.TMDB_KEY })}`;
    const res = await remoteFetch(url);
    return res.json();
  } else {
    const url = `https://www.omdbapi.com/?${new URLSearchParams({ ...params, apikey: process.env.OMDB_KEY })}`;
    const res = await remoteFetch(url);
    return res.json();
  }
}

export function normalizeMovie(raw: any) {
  return {
    id: raw.id || raw.imdbID,
    title: raw.title || raw.Title,
    overview: raw.overview || raw.Plot,
    poster: raw.poster_path ? `https://image.tmdb.org/t/p/w780${raw.poster_path}` : raw.Poster,
    releaseDate: raw.release_date || raw.Released,
    genres: raw.genres ?? (raw.Genre ? raw.Genre.split(',').map((s: string) => s.trim()) : [])
  };
}
EOF

          cat > src/lib/queryClient.ts <<'EOF'
import { QueryClient } from '@tanstack/react-query';

export const queryClient = new QueryClient({
  defaultOptions: {
    queries: {
      staleTime: 1000 * 30,
      cacheTime: 1000 * 60 * 60,
      retry: (failureCount, error) => {
        const status = (error as any)?.status;
        return !status || status >= 500;
      },
      retryDelay: (attemptIndex) => Math.min(1000 * 2 ** attemptIndex + Math.random() * 200, 10000),
      refetchOnWindowFocus: true,
      refetchOnReconnect: true,
      refetchOnMount: false,
      suspense: true,
      useErrorBoundary: true
    }
  }
});
EOF

