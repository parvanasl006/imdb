name: Create scaffold

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a tiny scaffold folder
        run: |
          mkdir -p scaffold-test
          echo "# IMDB-like scaffold test" > scaffold-test/README.md

      - name: Commit branch and push
        env:
          BRANCH: imdb-scaffold
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create branch if it does not exist, otherwise checkout it
          if git show-ref --verify --quiet refs/heads/${BRANCH}; then
            git checkout ${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi
          git add scaffold-test
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add small scaffold test"
          fi
          git push --set-upstream origin ${BRANCH}
